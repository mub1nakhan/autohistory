{% extends "base.html" %}

{% block title %}
Delete Vehicle
{% endblock %}

{% block content %}

<section class="delete-wrapper">

    <div class="delete-card">

        <h1>
            Delete Vehicle
        </h1>

        <p>
            Are you sure you want to delete
            <strong>{{ object.display_name }}</strong> ?
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="delete-actions">

                <button type="submit">
                    Delete
                </button>

                <a href="{% url 'vehicle-detail' object.pk %}">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
